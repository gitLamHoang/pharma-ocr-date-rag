name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --frozen --python 3.12 --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python scripts/evaluate.py
      - run: uv run python scripts/benchmark_retrieval.py
      - run: uv run python scripts/export_evidence.py --check
      - run: uv run python scripts/benchmark_multilingual.py --check
      - run: uv run python scripts/export_web.py --check
      - run: uv run python scripts/benchmark_ocr.py --check-report
      - run: uv run python scripts/benchmark_mhra_pdf.py --check-report
  public-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --frozen --python 3.12 --extra dev --extra research
      - run: uv run pytest tests/test_public_data.py tests/test_recalls.py -q
      - run: uv run python scripts/train_mhra.py --check
  image-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: uv sync --frozen --python 3.12 --extra tesseract
      - run: uv run python scripts/fetch_ocr_models.py
      - run: uv run python scripts/benchmark_ocr.py --require-complete --output outputs/ci-image-ocr.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-ocr-results
          path: outputs/ci-image-ocr.json
          if-no-files-found: warn
