# The static, in-browser build (rules only, no server) on GitHub Pages:
# https://gitlamhoang.github.io/pharma-ocr-date-rag/
# The full app (Claude + server) is the Docker deployment; see README.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm test
      # Base path /pharma-ocr-date-rag/ (vite.config.ts), Python core bundled from backend/.
      - run: npm run build
        env:
          VITE_MODE: static
      - run: npx playwright install --with-deps chromium
      # Runs the real in-browser engine (pdf.js, tesseract.js, Pyodide) on the built site.
      - run: npx playwright test -c playwright.static.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-static
          path: frontend/playwright-report-static
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
