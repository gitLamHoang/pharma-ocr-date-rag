[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-ocr-date-rag"
version = "0.1.0"
description = "Local document date extraction, retrieval, and versioned human review"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Lam Phan" }]
dependencies = []

[project.optional-dependencies]
ocr = [
  "pillow>=10.0.0",
  "pytesseract>=0.3.10",
  "paddleocr>=2.7.0",
]
rag = [
  "llama-index>=0.10.0",
]
demo = [
  "streamlit>=1.32.0",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
pharma-date-rag = "pharma_ocr_date_rag.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pharma_ocr_date_rag = ["schema.sql"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Standalone examples support running from an uninstalled source checkout.
"scripts/*.py" = ["E402"]
"demo_app.py" = ["E402"]
