[project]
name = "pharma-dates"
version = "2.0.0.dev0"
description = "Find, label and check dates in pharmaceutical documents"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "anthropic[bedrock,vertex]>=0.70",
  "fastapi>=0.115",
  "pdfplumber>=0.11",
  "pillow>=11",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pypdfium2>=4.30",
  "pytesseract>=0.3.13",
  "python-multipart>=0.0.20",
  "rapidfuzz>=3.10",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "fpdf2>=2.8",
  "httpx>=0.28",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pharma_dates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
